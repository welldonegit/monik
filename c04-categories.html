  :root {
    --cream: #F6F4EF;
    --cream-hi: #FFFDFA;
    --ink: #211A17;
    --berry: #E52868;
    --blue: #4358D5;
    --yellow: #FFC42D;
    --orange: #F14B2F;
    --grape: #653CCB;
    --green: #176142;
    --coffee: #B4471F;
  }
  html, body { margin: 0; padding: 0; background: #F6F4EF; overflow-x: clip; }
  body { font-family: 'Fixel Text', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #E52868; text-decoration: none; }
  a:hover { color: #211A17; }
  a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; border-radius: 12px; }
  a:focus:not(:focus-visible) { outline: none; }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  button:focus:not(:focus-visible) { outline: none; }
  * { -webkit-tap-highlight-color: transparent; }

<div style="min-height:100vh;background:var(--cream);color:var(--ink);padding:0 clamp(20px,3.4vw,48px) 0;box-sizing:border-box;overflow-x:clip;">

  <div style="{{ headerWrapStyle }}">
  <header style="max-width:1344px;margin:0 auto;min-height:{{ barH }};background:var(--ink);border-radius:{{ barRadius }};display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px clamp(14px,1.8vw,28px);box-sizing:border-box;">

    <sc-if value="{{ deskNav }}" hint-placeholder-val="{{ true }}">
    <nav style="order:1;flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:4px clamp(16px,2.4vw,34px);">
      <a href="#" style="display:inline-flex;align-items:center;height:44px;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;line-height:20px;letter-spacing:0.04em;color:var(--cream);white-space:nowrap;transition:color 200ms ease;" style-hover="color:var(--berry);">ГОЛОВНА</a>
      <a href="#" style="display:inline-flex;align-items:center;height:44px;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;line-height:20px;letter-spacing:0.04em;color:var(--cream);white-space:nowrap;transition:color 200ms ease;" style-hover="color:var(--berry);">ПРОДУКЦІЯ</a>
      <a href="#" style="display:inline-flex;align-items:center;height:44px;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;line-height:20px;letter-spacing:0.04em;color:var(--cream);white-space:nowrap;transition:color 200ms ease;" style-hover="color:var(--berry);">НАТХНЕННЯ</a>
      <a href="#" style="display:inline-flex;align-items:center;height:44px;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;line-height:20px;letter-spacing:0.04em;color:var(--cream);white-space:nowrap;transition:color 200ms ease;" style-hover="color:var(--berry);">КОНТАКТИ</a>
    </nav>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="order:1;flex:1 1 0;display:flex;justify-content:flex-start;">
        <button type="button" aria-label="Меню" onClick="{{ toggleMenu }}" style="width:44px;height:44px;padding:0;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;">
          <span style="display:block;width:22px;height:2px;border-radius:1px;background:var(--cream);"></span>
          <span style="display:block;width:22px;height:2px;border-radius:1px;background:var(--cream);"></span>
          <span style="display:block;width:22px;height:2px;border-radius:1px;background:var(--cream);"></span>
        </button>
      </div>
    </sc-if>

    <a href="#" style="order:2;display:block;line-height:0;flex:0 0 auto;" aria-label="Monik">

    </a>

    <div style="order:3;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:clamp(12px,1.6vw,24px);">
      <sc-if value="{{ deskNav }}" hint-placeholder-val="{{ true }}">
        <a href="tel:0800215345" style="flex:0 0 auto;display:inline-flex;align-items:center;height:44px;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.02em;color:var(--cream);white-space:nowrap;transition:color 200ms ease;" style-hover="color:var(--berry);">0-800-215-345</a>
      </sc-if>
      <div style="flex:0 0 auto;position:relative;display:flex;align-items:center;gap:8px">

        <button type="button" aria-label="Українська" onClick="{{ pickUA }}" onMouseEnter="{{ hoverUA }}" onMouseLeave="{{ hoverOff }}" style="position:relative;z-index:1;width:40px;height:40px;padding:0;border:none;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.04em;transition:color 200ms ease,background 200ms ease;background:{{ uaBg }};color:{{ uaColor }}">UA</button>
        <button type="button" aria-label="English" onClick="{{ pickEN }}" onMouseEnter="{{ hoverEN }}" onMouseLeave="{{ hoverOff }}" style="position:relative;z-index:1;width:40px;height:40px;padding:0;border:none;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:'Fixel Text',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.04em;transition:color 200ms ease,background 200ms ease;background:{{ enBg }};color:{{ enColor }}">EN</button>
      </div>
    </div>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav style="order:4;flex:1 1 100%;min-width:0;display:flex;flex-direction:column;padding:4px 0 8px;">
        <a href="#" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:52px;border-top:1px solid rgba(246,244,239,0.18);font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.06em;color:var(--cream);" style-hover="color:var(--berry);">ГОЛОВНА</a>
        <a href="#" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:52px;border-top:1px solid rgba(246,244,239,0.18);font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.06em;color:var(--cream);" style-hover="color:var(--berry);">ПРОДУКЦІЯ</a>
        <a href="#" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:52px;border-top:1px solid rgba(246,244,239,0.18);font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.06em;color:var(--cream);" style-hover="color:var(--berry);">НАТХНЕННЯ</a>
        <a href="#" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:52px;border-top:1px solid rgba(246,244,239,0.18);font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.06em;color:var(--cream);" style-hover="color:var(--berry);">КОНТАКТИ</a>
        <a href="tel:0800215345" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:52px;border-top:1px solid rgba(246,244,239,0.18);font-family:'Fixel Text',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.06em;color:var(--cream);" style-hover="color:var(--berry);">0-800-215-345</a>

  <section data-screen-label="Slider" style="{{ sectionStyle }}">

          <button type="button" aria-label="Попередня категорія" onClick="{{ goPrev }}" style="{{ peekPrevStyle }}">

              <text fill="{{ badgeInk }}" font-family="Fixel Text, sans-serif" font-size="9.8" font-weight="800" letter-spacing="0.35">

              <text fill="{{ badgeInk }}" font-family="Fixel Text, sans-serif" font-size="9.6" font-weight="700" letter-spacing="1.2">

              </g>
            </svg>
          </div>
          <button type="button" aria-label="Наступна категорія" onClick="{{ goNext }}" style="{{ peekNextStyle }}">
            <img src="{{ nextImg }}" alt="{{ nextAlt }}" loading="lazy" style="{{ peekImgStyle }}" />
          </button>
        </div>

        <div style="{{ footRowStyle }}">
          <div style="{{ textColStyle }}">
            <a href="#" onMouseEnter="{{ linkOn }}" onMouseLeave="{{ linkOff }}" onFocus="{{ linkOn }}" onBlur="{{ linkOff }}" style="{{ linkStyle }}">
              <span>Переглянути товари</span>

              <button type="button" aria-label="Наступна категорія" onClick="{{ goNext }}" onMouseEnter="{{ nextOn }}" onMouseLeave="{{ navOff }}" style="{{ nextStyle }}">

    <div style="padding-bottom:{{ quickHeadGap }};">
      <h2 style="{{ quickTitleStyle }}">Швидкий вибір</h2>
    </div>
    <nav style="display:flex;flex-direction:column;">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
        <button type="button" onClick="{{ r.go }}" onMouseEnter="{{ r.on }}" onMouseLeave="{{ r.off }}" onFocus="{{ r.on }}" onBlur="{{ r.off }}" style="{{ r.style }}">
          <span style="{{ r.indexStyle }}">{{ r.index }}</span>
          <span style="{{ r.nameStyle }}">{{ r.title }}</span>
          <span aria-hidden="true" style="{{ r.arrowWrapStyle }}">
            <svg width="22" height="9" viewBox="0 0 30 10" fill="none" stroke="currentColor" stroke-width="1.4" style="{{ r.arrowStyle }}"><path d="M0 5h28"></path><path d="M23.6 1 28 5l-4.4 4"></path></svg>
          </span>
        </button>
      </sc-for>
    </nav>

<script type="text/x-dc" data-dc-script data-props="{&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Слайдер&quot;},&quot;autoplayMs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6000,&quot;min&quot;:3000,&quot;max&quot;:12000,&quot;step&quot;:500,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Слайдер&quot;}}">
class Component extends DCLogic {
  state = {
    mobile: false, tablet: false,
    disp: 0, baseIdx: 0, phase: 'in',
    revealColor: null, revealOpen: false, revealAnim: true,
    hoverRow: null, nav: null, dot: null, linkHot: false,
    lang: 'UA', langHover: null, menuOpen: false
  };

  cats = [
    { title: 'Ягідні чаї', img: 'assets/tea.png', color: '#E52868', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Сиропи до кави', img: 'assets/syrup.png', color: '#B4471F', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Джеми', img: 'assets/jam.png', color: '#653CCB', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Кулінарні добавки', img: 'assets/spices.png', color: '#FFC42D', fg: '#211A17', accent: '#211A17' },
    { title: 'Топінги', img: 'assets/jam.png', color: '#F14B2F', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Сиропи для приготування коктейлів', img: 'assets/syrup.png', color: '#4358D5', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Концентрати для приготування лимонаду', img: 'assets/lemonade-orange.png', color: '#FFC42D', fg: '#211A17', accent: '#B4471F' },
    { title: 'Напої сухі розчинні Lito', img: 'assets/tea.png', color: '#176142', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Сухі суміші для приготування желе', img: 'assets/lemonade-watermelon.png', color: '#E52868', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Сухі суміші для приготування киселю', img: 'assets/jam.png', color: '#653CCB', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Сухі суміші для приготування морозива', img: 'assets/lemonade-mojito.png', color: '#4358D5', fg: '#F6F4EF', accent: '#FFC42D' },
    { title: 'Горіхи та сухофрукти', img: 'assets/spices.png', color: '#B4471F', fg: '#F6F4EF', accent: '#FFC42D' }
  ];

  timers = [];
  busy = false;
  paused = false;
  stage = null;

  componentDidMount() {
    this.mqM = window.matchMedia('(max-width: 767px)');
    this.mqT = window.matchMedia('(min-width: 768px) and (max-width: 1023px)');
    this.mqR = window.matchMedia('(prefers-reduced-motion: reduce)');
    this.onMqM = (e) => this.setState({ mobile: e.matches, menuOpen: e.matches ? this.state.menuOpen : false });
    this.onMqT = (e) => this.setState({ tablet: e.matches });
    this.mqM.addEventListener('change', this.onMqM);
    this.mqT.addEventListener('change', this.onMqT);
    this.setState({ mobile: this.mqM.matches, tablet: this.mqT.matches });

    this.onKey = (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); this.go(this.state.disp + 1, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.go(this.state.disp - 1, true); }
    };
    document.addEventListener('keydown', this.onKey);
    this.onVis = () => { if (!document.hidden) this.arm(6000); };
    document.addEventListener('visibilitychange', this.onVis);

    this.preload(0);
    this.arm(6000);
  }

  componentWillUnmount() {
    if (this.mqM) this.mqM.removeEventListener('change', this.onMqM);
    if (this.mqT) this.mqT.removeEventListener('change', this.onMqT);
    document.removeEventListener('keydown', this.onKey);
    document.removeEventListener('visibilitychange', this.onVis);
    this.clear();
    if (this.auto) clearTimeout(this.auto);
  }

  preload(i) {
    const n = this.cats.length;
    [(i + 1) % n, (i - 1 + n) % n].forEach((k) => { const im = new Image(); im.src = this.cats[k].img; });
  }

  t(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  clear() { this.timers.forEach(clearTimeout); this.timers = []; }

  arm(delay) {
    if (this.auto) clearTimeout(this.auto);
    if (this.props.autoplay === false) return;
    const step = this.props.autoplayMs || 6000;
    this.auto = setTimeout(() => {
      if (this.props.autoplay === false) return;
      if (this.paused || document.hidden || this.busy) { this.arm(1200); return; }
      this.go(this.state.disp + 1, false);
    }, delay === 6000 ? step : delay);
  }

  go(n, manual) {
    const total = this.cats.length;
    n = ((n % total) + total) % total;
    if (this.busy || n === this.state.disp) return;
    this.busy = true;
    this.clear();
    if (this.auto) clearTimeout(this.auto);
    this.preload(n);
    const after = manual ? 8000 : 6000;

    if (this.mqR && this.mqR.matches) {
      this.setState({ phase: 'out' });
      this.t(180, () => this.setState({ disp: n, baseIdx: n, phase: 'pre' }));
      this.t(210, () => this.setState({ phase: 'in' }));
      this.t(420, () => { this.busy = false; this.arm(after); });
      return;
    }

    this.setState({ phase: 'out', revealColor: this.cats[n].color, revealAnim: true, revealOpen: false });
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ revealOpen: true })));
    this.t(180, () => this.setState({ disp: n, phase: 'pre' }));
    this.t(210, () => this.setState({ phase: 'in' }));
    this.t(590, () => this.setState({ baseIdx: n, revealAnim: false, revealOpen: false }));
    this.t(650, () => { this.setState({ revealAnim: true }); this.busy = false; this.arm(after); });
  }

  jump(n) {
    this.go(n, true);
    const el = this.stage;
    if (el) {
      const top = el.getBoundingClientRect().top + window.pageYOffset - 16;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  }

  langStyle(code) {
    const active = this.state.lang === code;
    const hot = this.state.langHover === code;
    return {
      bg: active ? 'transparent' : hot ? 'rgba(246,244,239,0.14)' : 'transparent',
      color: active ? 'var(--ink)' : hot ? 'var(--cream-hi)' : 'rgba(246,244,239,0.72)'
    };
  }

  titleSize(len, mob, tab) {
    const b = len > 33 ? 3 : len > 22 ? 2 : len > 12 ? 1 : 0;
    if (mob) return ['clamp(46px,15vw,66px)', 'clamp(42px,12.8vw,58px)', 'clamp(37px,10.2vw,50px)', 'clamp(34px,8.8vw,44px)'][b];
    if (tab) return ['clamp(58px,9vw,112px)', 'clamp(52px,7.6vw,96px)', 'clamp(44px,6vw,78px)', 'clamp(38px,5vw,64px)'][b];
    return ['clamp(72px,10vw,170px)', 'clamp(64px,8.4vw,146px)', 'clamp(52px,6.4vw,112px)', 'clamp(44px,5.2vw,92px)'][b];
  }

  renderVals() {
    const mob = this.state.mobile, tab = this.state.tablet;
    const st = this.state;
    const total = this.cats.length;
    const cur = this.cats[st.disp];
    const prev = this.cats[(st.disp - 1 + total) % total];
    const next = this.cats[(st.disp + 1) % total];
    const base = this.cats[st.baseIdx];
    const fg = cur.fg;
    const soft = fg === '#F6F4EF' ? 'rgba(246,244,239,' : 'rgba(33,26,23,';
    const ph = st.phase;

    const move = (yIn, extra) =>
      ph === 'out' ? 'opacity:0;transform:translateY(-12px)' + (extra ? ' scale(1)' : '') + ';transition:opacity 180ms ease,transform 180ms ease;'
      : ph === 'pre' ? 'opacity:0;transform:translateY(' + yIn + 'px)' + (extra ? ' scale(.97)' : '') + ';transition:none;'
      : 'opacity:1;transform:translateY(0)' + (extra ? ' scale(1)' : '') + ';transition:opacity ' + (extra ? 420 : 380) + 'ms cubic-bezier(0.22,0.61,0.36,1) ' + (extra ? 0 : 45) + 'ms,transform ' + (extra ? 420 : 380) + 'ms cubic-bezier(0.22,0.61,0.36,1) ' + (extra ? 0 : 45) + 'ms;';

    const textAnim = move(14, false);
    const prodAnim = move(22, true);

    const dots = this.cats.map((c, i) => ({
      label: 'Перейти до категорії ' + c.title,
      go: () => this.go(i, true),
      on: () => this.setState({ dot: i }),
      off: () => this.setState({ dot: null }),
      style: 'flex:0 0 auto;width:' + (i === st.disp ? '32px' : '16px') + ';height:22px;padding:9px 0;box-sizing:border-box;border:none;cursor:pointer;background-clip:content-box;transition:width 320ms cubic-bezier(0.76,0,0.24,1),background-color 240ms ease;background-color:' + soft + (i === st.disp ? '1' : st.dot === i ? '0.72' : '0.32') + ');'
    }));

    const rows = this.cats.map((c, i) => {
      const hot = st.hoverRow === i;
      const on = hot ? c.fg : 'var(--ink)';
      return {
        title: c.title,
        index: String(i + 1).padStart(2, '0'),
        go: () => this.jump(i),
        on: ((k) => () => this.setState({ hoverRow: k }))(i),
        off: () => this.setState({ hoverRow: null }),
        style: 'display:flex;align-items:center;gap:' + (mob ? '14px' : 'clamp(18px,2vw,32px)') + ';width:100%;min-height:' + (mob ? '58px' : 'clamp(64px,5vw,76px)') + ';padding:' + (mob ? '10px 14px' : '10px clamp(16px,1.8vw,26px)') + ';box-sizing:border-box;text-align:left;cursor:pointer;border:none;border-top:1px solid ' + (hot ? 'transparent' : 'rgba(33,26,23,0.14)') + ';border-radius:' + (mob ? '14px' : '18px') + ';transition:background-color 240ms ease,color 240ms ease,border-color 240ms ease;color:' + on + ';background:' + (hot ? c.color : 'transparent') + ';' + (i === this.cats.length - 1 ? 'border-bottom:1px solid ' + (hot ? 'transparent' : 'rgba(33,26,23,0.14)') + ';' : ''),
        indexStyle: 'flex:0 0 auto;font-family:"Fixel Text",sans-serif;font-weight:700;font-size:' + (mob ? '12px' : '13px') + ';letter-spacing:0.06em;color:' + (hot ? c.fg : 'rgba(33,26,23,0.42)') + ';transition:color 240ms ease;',
        nameStyle: "flex:1 1 auto;min-width:0;font-family:'Fixel Display',sans-serif;font-weight:800;font-size:" + (mob ? '22px' : 'clamp(26px,2.6vw,40px)') + ';line-height:1.04;letter-spacing:-0.02em;text-wrap:pretty;',
        arrowWrapStyle: 'flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:' + (mob ? '40px' : '46px') + ';height:' + (mob ? '40px' : '46px') + ';box-sizing:border-box;border:1.4px solid currentColor;border-radius:' + (hot ? '50% 10px 50% 50%' : '50% 50% 10px 50%') + ';transition:border-radius 320ms cubic-bezier(0.76,0,0.24,1),opacity 240ms ease,transform 320ms cubic-bezier(0.22,0.61,0.36,1);opacity:' + (hot ? 1 : 0.42) + ';transform:translateY(' + (hot ? -2 : 0) + 'px);',
        arrowStyle: 'display:block;transition:transform 240ms ease;transform:translateX(' + (hot ? 3 : 0) + 'px);'
      };
    });

    const pad = mob ? '22px 20px 20px' : tab ? 'clamp(28px,3.4vw,36px)' : 'clamp(36px,3.2vw,52px)';

    return {
      title: cur.title,
      img: cur.img,
      alt: cur.title + ' Monik — продуктова композиція',
      prevImg: prev.img,
      prevAlt: prev.title + ' Monik — попередня категорія',
      nextImg: next.img,
      nextAlt: next.title + ' Monik — наступна категорія',
      num: String(st.disp + 1).padStart(2, '0') + ' / ' + String(this.cats.length).padStart(2, '0'),
      dots, rows,

      stageRef: (el) => { this.stage = el; },
      stageIn: () => { this.paused = true; },
      stageOut: () => { this.paused = false; this.arm(6000); },
      touchStart: (e) => { this.tx = e.touches[0].clientX; this.ty = e.touches[0].clientY; },
      touchEnd: (e) => {
        if (this.tx == null) return;
        const dx = e.changedTouches[0].clientX - this.tx;
        const dy = e.changedTouches[0].clientY - this.ty;
        this.tx = null;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) this.go(this.state.disp + (dx < 0 ? 1 : -1), true);
      },
      goPrev: () => this.go(st.disp - 1, true),
      goNext: () => this.go(st.disp + 1, true),
      prevOn: () => this.setState({ nav: 'p' }),
      nextOn: () => this.setState({ nav: 'n' }),
      navOff: () => this.setState({ nav: null }),
      linkOn: () => this.setState({ linkHot: true }),
      linkOff: () => this.setState({ linkHot: false }),

      headerWrapStyle: 'position:relative;z-index:3;background:' + base.color + ';transition:background-color 190ms linear;margin:0 calc(-1 * clamp(20px,3.4vw,48px));padding:' + (mob ? '10px' : 'clamp(12px,1.4vw,20px)') + ' clamp(20px,3.4vw,48px);box-sizing:border-box;',
      sectionStyle: 'position:relative;margin:0 calc(-1 * clamp(20px,3.4vw,48px));box-sizing:border-box;',
      stageStyle: 'position:relative;isolation:isolate;overflow:hidden;transform:translateZ(0);width:100%;box-sizing:border-box;height:100svh;min-height:' + (mob ? '620px' : '650px') + ';',
      peekPrevStyle: 'position:absolute;left:0;bottom:0;z-index:0;height:' + (mob ? '32%' : '50%') + ';width:' + (mob ? '38%' : '26%') + ';padding:0;border:none;background:transparent;cursor:pointer;opacity:0.92;transform:translateX(' + (mob ? '-48%' : '-42%') + ');',
      peekNextStyle: 'position:absolute;right:0;bottom:0;z-index:0;height:' + (mob ? '32%' : '50%') + ';width:' + (mob ? '38%' : '26%') + ';padding:0;border:none;background:transparent;cursor:pointer;opacity:0.92;transform:translateX(' + (mob ? '48%' : '42%') + ');',
      peekImgStyle: 'display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 20px 30px rgba(33,26,23,0.3)) brightness(0.92);',
      badgeStyle: 'position:absolute;z-index:2;pointer-events:none;' + (mob ? 'top:6%;right:2%;width:128px;height:128px;' : 'left:' + (tab ? '16%' : '20%') + ';bottom:26%;width:clamp(108px,11vw,168px);height:clamp(108px,11vw,168px);') + textAnim,
      badgeFill: cur.accent,
      badgeInk: cur.color,
      baseStyle: 'position:absolute;inset:0;z-index:0;transition:background-color 190ms linear;background:' + base.color + ';',
      revealStyle: 'position:absolute;inset:0;z-index:1;will-change:clip-path;pointer-events:none;' + (st.revealAnim ? 'transition:clip-path 560ms cubic-bezier(0.76,0,0.24,1);' : 'transition:none;') + 'clip-path:circle(' + (st.revealOpen ? '150%' : '0%') + ' at 50% 50%);background:' + (st.revealColor || base.color) + ';',
      innerStyle: 'position:absolute;inset:0;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:' + (mob ? '12px' : 'clamp(12px,1.4vw,20px)') + ';padding:' + pad + ';box-sizing:border-box;',

      headStyle: 'min-width:0;display:flex;justify-content:center;' + textAnim,
      titleStyle: "margin:0;max-width:" + (mob ? '100%' : '94%') + ";text-align:center;font-family:'Fixel Display',sans-serif;font-weight:800;text-transform:uppercase;font-size:" + this.titleSize(cur.title.length, mob, tab) + ';line-height:' + (mob ? '0.92' : '0.86') + ';letter-spacing:-0.02em;text-wrap:balance;color:' + cur.accent + ';',
      numStyle: 'margin:0;flex:0 0 auto;font-family:"Fixel Text",sans-serif;font-weight:700;font-size:' + (mob ? '12px' : '14px') + ';letter-spacing:0.1em;color:' + soft + '0.7);',

      prodStyle: 'position:relative;z-index:1;display:block;width:100%;max-width:100%;height:' + (mob ? '112%' : '120%') + ';align-self:' + (mob ? 'center' : 'flex-end') + ';margin-top:' + (mob ? '-14%' : '-6%') + ';object-fit:contain;object-position:50% ' + (mob ? '50%' : '100%') + ';filter:drop-shadow(0 34px 46px rgba(33,26,23,0.34));' + prodAnim,

      footRowStyle: 'display:flex;align-items:center;justify-content:space-between;gap:' + (mob ? '14px' : '28px') + ';flex-wrap:' + (mob ? 'wrap' : 'nowrap') + ';min-width:0;',
      textColStyle: 'min-width:0;display:flex;align-items:center;gap:' + (mob ? '16px' : '24px') + ';flex:1 1 auto;' + textAnim,
      linkStyle: 'align-self:flex-start;display:inline-flex;align-items:center;gap:14px;min-height:' + (mob ? '50px' : '58px') + ';padding:0 ' + (mob ? '22px' : '28px') + ';box-sizing:border-box;font-family:"Fixel Text",sans-serif;font-weight:800;font-size:' + (mob ? '14px' : '16px') + ';letter-spacing:0.01em;white-space:nowrap;border-radius:' + (st.linkHot ? '999px 999px 999px 10px' : '10px 999px 999px 999px') + ';transition:border-radius 320ms cubic-bezier(0.76,0,0.24,1),transform 320ms cubic-bezier(0.22,0.61,0.36,1),background-color 240ms ease,color 240ms ease;transform:translateY(' + (st.linkHot ? -3 : 0) + 'px);background:' + cur.accent + ';color:' + cur.color + ';',
      arrowStyle: 'display:block;flex:0 0 auto;transition:transform 240ms cubic-bezier(0.22,0.61,0.36,1);transform:translateX(' + (st.linkHot ? 8 : 0) + 'px);',

      ctrlColStyle: 'display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0;justify-content:flex-end;',
      dotsStyle: 'display:flex;align-items:center;gap:6px;min-width:0;' + (mob ? 'overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;' : ''),
      prevStyle: 'width:' + (mob ? '48px' : '56px') + ';height:' + (mob ? '48px' : '56px') + ';padding:0;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:' + (st.nav === 'p' ? '10px 50% 50% 50%' : '50% 50% 50% 10px') + ';transition:border-radius 320ms cubic-bezier(0.76,0,0.24,1),transform 320ms cubic-bezier(0.22,0.61,0.36,1),background-color 240ms ease,color 240ms ease;transform:translateY(' + (st.nav === 'p' ? -3 : 0) + 'px);color:' + (st.nav === 'p' ? cur.color : fg) + ';background:' + (st.nav === 'p' ? cur.accent : soft + '0.16)') + ';',
      nextStyle: 'width:' + (mob ? '48px' : '56px') + ';height:' + (mob ? '48px' : '56px') + ';padding:0;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:' + (st.nav === 'n' ? '50% 10px 50% 50%' : '50% 50% 10px 50%') + ';transition:border-radius 320ms cubic-bezier(0.76,0,0.24,1),transform 320ms cubic-bezier(0.22,0.61,0.36,1),background-color 240ms ease,color 240ms ease;transform:translateY(' + (st.nav === 'n' ? -3 : 0) + 'px);color:' + (st.nav === 'n' ? cur.color : fg) + ';background:' + (st.nav === 'n' ? cur.accent : soft + '0.16)') + ';',

      quickPad: mob ? '40px 0 0' : 'clamp(56px,6vw,88px) 0 0',
      quickHeadGap: mob ? '16px' : '24px',
      quickTitleStyle: "margin:0;font-family:'Fixel Display',sans-serif;font-weight:800;font-size:" + (mob ? 'clamp(32px,9vw,40px)' : 'clamp(40px,4.4vw,68px)') + ';line-height:0.96;letter-spacing:-0.03em;color:var(--ink);',

      barH: mob ? '64px' : '76px',
      barRadius: mob ? '24px' : '999px',
      langX: st.lang === 'EN' ? '48px' : '0px',
      isMobile: mob,
      deskNav: !mob,
      menuOpen: mob && st.menuOpen,
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      uaBg: this.langStyle('UA').bg,
      uaColor: this.langStyle('UA').color,
      enBg: this.langStyle('EN').bg,
      enColor: this.langStyle('EN').color,
      pickUA: () => this.setState({ lang: 'UA' }),
      pickEN: () => this.setState({ lang: 'EN' }),
      hoverUA: () => this.setState({ langHover: 'UA' }),
      hoverEN: () => this.setState({ langHover: 'EN' }),
      hoverOff: () => this.setState({ langHover: null })
    };
  }
}
</script>
