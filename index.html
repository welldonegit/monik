<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monik — Солодкі радості життя</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="module" src="/scripts/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__bar">
      <nav class="site-nav" aria-label="Головна навігація">
        <ul class="site-nav__list">
          <li><a class="site-nav__link text-nav" href="#" aria-current="page">Головна</a></li>
          <li><a class="site-nav__link text-nav" href="#">Продукція</a></li>
          <li><a class="site-nav__link text-nav" href="#">Натхнення</a></li>
          <li><a class="site-nav__link text-nav" href="#">Контакти</a></li>
        </ul>
      </nav>

      <a class="site-header__logo" href="#" aria-label="Monik">
        <img class="site-header__logo-img" src="/assets/monik-logo.svg" alt="Monik" width="132" height="38">
      </a>

      <div class="site-header__actions">
        <a class="site-header__phone text-nav" href="tel:0800215345">0-800-215-345</a>
        <div class="lang-switch" role="group" aria-label="Мова">
          <button class="lang-switch__btn text-lang is-active" type="button" aria-pressed="true">UA</button>
          <button class="lang-switch__btn text-lang" type="button" aria-pressed="false">EN</button>
        </div>
        <button class="site-header__burger" type="button" aria-label="Меню" aria-expanded="false" aria-controls="mobile-menu">
          <span></span><span></span><span></span>
        </button>
      </div>

      <nav class="mobile-menu" id="mobile-menu" aria-label="Мобільна навігація" hidden>
        <ul class="mobile-menu__list">
          <li><a class="mobile-menu__link text-nav" href="#">Головна</a></li>
          <li><a class="mobile-menu__link text-nav" href="#">Продукція</a></li>
          <li><a class="mobile-menu__link text-nav" href="#">Натхнення</a></li>
          <li><a class="mobile-menu__link text-nav" href="#">Контакти</a></li>
          <li><a class="mobile-menu__link text-nav" href="tel:0800215345">0-800-215-345</a></li>
        </ul>
      </nav>
    </div>

</html>
